# Continued (domain-adaptive) pretraining of GPT-2 on the stratified PubMed corpus.

seed: 42

mlflow:
  tracking_uri: sqlite:///mlflow.db
  experiment_name: gpt2-pubmed-pretrain
  registered_model_name: gpt2-pubmed-dapt
  log_system_metrics: true

model:
  model_id: openai-community/gpt2
  # Block size of the packed training sequences (GPT-2 context window)
  max_seq_len: 1024

corpus:
  # JSONL shards written by pubmed-extractor/build_corpus.py (never modified)
  raw_dir: ~/Documents/Projects/pubmed-corpus
  processed_dir: data/processed/pubmed_v1
  # Held-out documents for validation perplexity, sampled within each stratum
  validation_fraction: 0.01
  # Templated administrative sections (funding, ethics, author contributions, ...)
  remove_boilerplate_sections: true
  # Inline markers such as [1-3] and (Smith et al., 2020)
  remove_citations: true
  # Articles used by this benchmark are removed from the corpus (decontamination)
  benchmark_dataset_id: qiaojin/PubMedQA
  benchmark_subset: pqa_labeled
  num_proc: 16

pretraining:
  output_dir: checkpoints/pretrain/gpt2-pubmed-dapt
  # Continued pretraining uses a lower peak rate than GPT-2's original 6e-4
  learning_rate: 1.0e-4
  lr_scheduler_type: cosine
  warmup_ratio: 0.05
  weight_decay: 0.1
  max_grad_norm: 1.0
  num_train_epochs: 1.0
  # 32 x 16 = 512 blocks of 1024 tokens, about 0.5M tokens per optimizer step
  per_device_batch_size: 32
  gradient_accumulation_steps: 16
  eval_batch_size: 64
  eval_steps: 100
  save_steps: 100
  save_total_limit: 2
  logging_steps: 10
  bf16: true
  # Compile the model graph (slower first steps, faster afterwards)
  torch_compile: true
  optim: adamw_torch_fused
  dataloader_num_workers: 4
  # Alias set on the registered model after a full run (promote to champion by hand)
  registry_alias: candidate

# Short runs to compare peak learning rates before the full run.
# Each run decays its cosine schedule over max_steps, so short runs favour
# higher rates: use the sweep to rule out bad values, not to pick precisely.
lr_sweep:
  learning_rates: [5.0e-5, 1.0e-4, 3.0e-4]
  max_steps: 150
