# Multitask fine-tuning on MedText, PubMedQA and MedMCQA.
# Floats need a decimal point (1.0e-5, not 1e-5): PyYAML reads 1e-5 as a string.

seed: 42

mlflow:
  tracking_uri: sqlite:///mlflow.db
  experiment_name: gpt2-med-multitask
  registered_model_name: gpt2-med-multitask
  log_system_metrics: true

model:
  # Base model: the Hub id, or the pretrained one (models:/gpt2-pubmed-dapt@champion)
  model_id: openai-community/gpt2
  max_seq_len: 1024

training:
  # Number of mixture epochs built; early stopping usually ends training sooner
  max_epochs: 5
  early_stopping_patience: 2
  eval_batch_size: 8
  max_grad_norm: 1.0
  weight_decay: 0.01
  lr_scheduler_type: constant
  warmup_ratio: 0.05

multitask:
  processed_dir: data/processed/multitask_v1
  medtext_dir: data/processed/medtext_v1
  pubmedqa_dataset_id: qiaojin/PubMedQA
  pubmedqa_test_ground_truth: data/benchmarks/pubmedqa_test_ground_truth.json
  # PQA-L questions outside the official test set: 450 train / 50 validation
  pubmedqa_validation_size: 50
  medmcqa_dataset_id: openlifescienceai/medmcqa
  # Held out from MedMCQA train for model selection (official validation = test)
  medmcqa_dev_fraction: 0.05
  # Examples per mixture epoch
  medtext_repeats: 5
  pubmedqa_labeled_repeats: 5
  # PQA-A is 93% "yes": sample this many of each decision per epoch
  pubmedqa_artificial_per_class: 15000
  medmcqa_per_epoch: 60000
  # MedMCQA questions in the combined dev set used for early stopping
  dev_medmcqa_size: 150
  num_proc: 16

finetune:
  learning_rate: 8.0e-5
  batch_size: 16
  seeds: [42, 43, 44]
  output_dir: checkpoints/multitask

# Optuna search on the original GPT-2 before the full runs; copy the best values
# into `finetune` (and `training`) so the final runs are reproducible from git.
sweep:
  n_trials: 12
  # A mapping with low/high is a float range; a list is a categorical choice
  search_space:
    learning_rate: {low: 1.0e-5, high: 3.0e-4, log: true}
    batch_size: [8, 16, 32]
    lr_scheduler_type: [constant, cosine]
    warmup_ratio: [0.0, 0.05]
  # Budget per trial, in mixture epochs (the first epoch of the training set)
  train_epochs: 1.0
  # Dev evaluations per mixture epoch (each one is a pruning checkpoint)
  evals_per_epoch: 4
  # Let this many trials finish before pruning, and never prune at the first evaluation
  pruner_startup_trials: 4
  pruner_warmup_evals: 1
  results_path: experiments/multitask_sweep_results.json
  trials_dir: checkpoints/multitask_sweep
