# @package _global_
# GPT-2 small (124M): the archived first experiment (git tag v1-gpt2), with the
# values chosen by its sweeps. Its fine-tuning data is the v1 set (no MedQA),
# filtered with the GPT-2 tokenizer at 1024 tokens.

model:
  name: gpt2
  model_id: openai-community/gpt2
  # GPT-2 context window (n_positions)
  max_seq_len: 1024

pretraining:
  # Best rate of lr_sweep (3e-4 beat 5e-5 and 1e-4 after 150 steps)
  learning_rate: 3.0e-4
  # 32 x 16 blocks of 1024 tokens, about 0.5M tokens per optimizer step
  per_device_batch_size: 32
  gradient_accumulation_steps: 16
  eval_batch_size: 64
  gradient_checkpointing: false

lr_sweep:
  learning_rates: [5.0e-5, 1.0e-4, 3.0e-4]

data_filter:
  tokenizer: openai-community/gpt2
  max_seq_len: 1024

finetune_data:
  processed_dir: data/processed/multitask_v1

corpus:
  processed_dir: data/processed/pubmed_v1_gpt2

finetune:
  method: full
  # Best trial of the multitask sweep
  learning_rate: 8.0e-5
  batch_size: 16
  gradient_checkpointing: false
  seeds: [42, 43, 44]

sweep:
  search_space:
    learning_rate: {low: 1.0e-5, high: 3.0e-4, log: true}
