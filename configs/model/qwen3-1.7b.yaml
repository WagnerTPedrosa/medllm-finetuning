# @package _global_
# Qwen3-1.7B base model (not the instruct one: pretraining and fine-tuning start
# from the same raw model, as with GPT-2). Full fine-tuning in fp32 weights with
# bf16 autocast needs about 16 bytes per parameter (~28 GB) plus activations.

model:
  name: qwen3-1.7b
  model_id: Qwen/Qwen3-1.7B-Base
  max_seq_len: 2048

pretraining:
  # From lr_sweep (150 steps each, PubMed validation loss from 1.848):
  # 1e-5 -> 1.8235, 3e-5 -> 1.8187, 1e-4 -> 1.8174. 1e-4 gains almost nothing
  # over 3e-5 and raised the loss in its first steps (forgetting risk)
  learning_rate: 3.0e-5
  # 4 x 64 blocks of 2048 tokens, about 0.5M tokens per optimizer step
  per_device_batch_size: 4
  gradient_accumulation_steps: 64
  # The 152k-token vocabulary makes the logits large: keep evaluation batches small
  eval_batch_size: 8
  gradient_checkpointing: false

lr_sweep:
  learning_rates: [1.0e-5, 3.0e-5, 1.0e-4]

finetune:
  method: lora
  # Usual LoRA starting rate (adapters need higher rates than full fine-tuning);
  # placeholder until the multitask sweep is run
  learning_rate: 2.0e-4
  batch_size: 16
  # A batch of 16 long examples (1536 tokens) needs ~58 GB with it and does not
  # fit in 96 GB without it; it costs ~30% speed
  gradient_checkpointing: true
  # One seed while the setup is explored
  seeds: [42]

sweep:
  search_space:
    learning_rate: {low: 5.0e-6, high: 1.0e-4, log: true}
