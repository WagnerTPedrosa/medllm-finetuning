# @package _global_
# Qwen3-1.7B base model (not the instruct one: pretraining and fine-tuning start
# from the same raw model, as with GPT-2). Full fine-tuning in fp32 weights with
# bf16 autocast needs about 16 bytes per parameter (~28 GB) plus activations.

model:
  name: qwen3-1.7b
  model_id: Qwen/Qwen3-1.7B-Base
  max_seq_len: 2048

pretraining:
  # Placeholder until lr_sweep is run: larger models want lower rates than GPT-2
  learning_rate: 3.0e-5
  # 4 x 64 blocks of 2048 tokens, about 0.5M tokens per optimizer step
  per_device_batch_size: 4
  gradient_accumulation_steps: 64
  # The 152k-token vocabulary makes the logits large: keep evaluation batches small
  eval_batch_size: 8
  gradient_checkpointing: false

lr_sweep:
  learning_rates: [1.0e-5, 3.0e-5, 1.0e-4]

finetune:
  # Placeholder until the multitask sweep is run
  learning_rate: 2.0e-5
  batch_size: 16
  gradient_checkpointing: false

sweep:
  search_space:
    learning_rate: {low: 5.0e-6, high: 1.0e-4, log: true}
