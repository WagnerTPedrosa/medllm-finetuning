[project]
name = "medllm"
version = "0.0.1"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pandas",
    "datasets",
    "huggingface_hub",
    "numpy>=2,<3",
    "torch",
    "transformers",
    "matplotlib",
    "scikit-learn",
    "trl>=1.17.1",
    "optuna>=5.0.0",
    "deepeval>=4.3.2",
    "anthropic>=2.3.0",
    "pyyaml>=6.0.3",
    "mlflow>=3.0.0",
    "nvidia-ml-py>=13.615.71",
    "hydra-core>=1.3.8",
    "dvc>=3.67.1",
    "peft>=0.21.2",
    "lm-eval>=0.4.9",
]

[project.optional-dependencies]
# Fast Gated DeltaNet kernels (Triton) for Qwen3.5-architecture models such as
# Qwen3.8-27B; without them transformers falls back to a slow PyTorch path
linear-attention = [
    "flash-linear-attention",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=9.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/medllm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Test files mirror the package (tests/data/test_*.py, ...) without __init__.py
addopts = "--import-mode=importlib"
