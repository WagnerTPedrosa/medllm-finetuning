[project]
name="medllm-finetuining"
version = "0.0.1"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pandas",
    "datasets",
    "huggingface_hub",
    "numpy>=2,<3",
    "torch",
    "transformers",
    "matplotlib",
    "scikit-learn",
    "trl>=1.17.1",
    "optuna>=5.0.0",
    "deepeval>=4.3.2",
    "anthropic>=2.3.0",
    "pyyaml>=6.0.3",
    "mlflow>=3.0.0",
    "nvidia-ml-py>=13.615.71",
    "hydra-core>=1.3.8",
    "dvc>=3.67.1",
    "peft>=0.21.2",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
