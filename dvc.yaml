# Pipeline: data -> PubMed pretraining -> multitask fine-tuning -> G-Eval -> report,
# for every base model in `models` (one file per model in configs/model/).
#
#   uv run dvc repro                      # everything that is out of date
#   uv run dvc repro geval@qwen3-1.7b     # one model, up to one stage
#   uv run dvc status                     # what would run, and why
#
# A stage runs again when its code, its inputs or the config keys under
# `params` change. Models live in the MLflow Model Registry; each training
# stage writes a small JSON summary to results/<model>/ (run ids, model URIs,
# metrics) that the next stages read. The sweeps (`src.pretrain --sweep`,
# `src.multitask_train --sweep`) are not stages: their chosen values go into
# the model file, so the runs here are reproducible from git.

vars:
  - models:
      - gpt2
      - qwen3-1.7b

stages:
  prepare_medtext:
    cmd: uv run python -m src.dataset_preparation --config configs/gpt2_medtext.yaml
    deps:
      - src/dataset_preparation.py
      - src/formatting.py
    params:
      - configs/gpt2_medtext.yaml:
          - seed
          - data
          - model
    outs:
      - data/processed/medtext_v1:
          cache: false

  prepare_multitask:
    cmd: uv run python -m src.multitask
    deps:
      - src/multitask.py
      - src/dataset_preparation.py
      - src/formatting.py
      - data/processed/medtext_v1
      - data/benchmarks/pubmedqa_test_ground_truth.json
    params:
      - configs/config.yaml:
          - seed
          - data_filter
          - multitask
    outs:
      - data/processed/multitask_v1:
          cache: false

  prepare_corpus:
    foreach: ${models}
    do:
      cmd: uv run python -m src.corpus model=${item}
      deps:
        - src/corpus.py
      params:
        - configs/config.yaml:
            - seed
            - corpus
        - configs/model/${item}.yaml:
            - model.model_id
            - model.max_seq_len
      outs:
        - data/processed/pubmed_v1_${item}:
            cache: false

  pretrain:
    foreach: ${models}
    do:
      cmd: uv run python -m src.pretrain model=${item}
      deps:
        - src/pretrain.py
        - src/modeling.py
        - src/tracking.py
        - data/processed/pubmed_v1_${item}
      params:
        - configs/config.yaml:
            - seed
            - pretraining
        - configs/model/${item}.yaml:
            - model
            - pretraining
      metrics:
        - results/${item}/pretrain.json:
            cache: false

  finetune_original:
    foreach: ${models}
    do:
      cmd: uv run python -m src.multitask_train --base original model=${item}
      deps:
        - src/multitask_train.py
        - src/choice_eval.py
        - src/evaluation.py
        - src/train.py
        - src/modeling.py
        - src/tracking.py
        - data/processed/multitask_v1
      params:
        - configs/config.yaml:
            - seed
            - training
            - finetune.seeds
        - configs/model/${item}.yaml:
            - model
            - finetune
      metrics:
        - results/${item}/finetune_original.json:
            cache: false

  finetune_dapt:
    foreach: ${models}
    do:
      cmd: uv run python -m src.multitask_train --base dapt model=${item}
      deps:
        - src/multitask_train.py
        - src/choice_eval.py
        - src/evaluation.py
        - src/train.py
        - src/modeling.py
        - src/tracking.py
        - data/processed/multitask_v1
        # The pretrained model it starts from
        - results/${item}/pretrain.json
      params:
        - configs/config.yaml:
            - seed
            - training
            - finetune.seeds
        - configs/model/${item}.yaml:
            - model
            - finetune
      metrics:
        - results/${item}/finetune_dapt.json:
            cache: false

  geval:
    foreach: ${models}
    do:
      cmd: uv run python -m src.geval model=${item}
      deps:
        - src/geval.py
        - src/inference.py
        - data/processed/multitask_v1
        - results/${item}/finetune_original.json
        - results/${item}/finetune_dapt.json
      params:
        - configs/config.yaml:
            - geval.judge_model
            - geval.max_new_tokens
            - geval.num_examples
      metrics:
        - results/${item}/geval.json:
            cache: false

  report:
    cmd: uv run python -m src.report
    deps:
      - src/report.py
      - results
    outs:
      - reports/comparison.md:
          cache: false
